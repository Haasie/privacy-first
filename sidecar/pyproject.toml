[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-first-sidecar"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub[hf_xet]>=0.23",
    "opf @ git+https://github.com/openai/privacy-filter.git",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.setuptools]
packages = ["sidecar"]
package-dir = {"sidecar" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
